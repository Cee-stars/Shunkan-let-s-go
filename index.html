<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>瞬間英作文</title>
<meta name="theme-color" content="#FBFBFD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="瞬間英作文">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
/* ============ tokens ============ */
:root{
  --bg:#FBFBFD; --surface:#FFFFFF; --surface-2:#F2F3F6;
  --ink:#16181D; --ink-2:#5C6270; --ink-3:#9AA0AC;
  --line:#E4E6EB; --line-2:#D3D7DE;
  --subj:#E0334B;   /* 主語=赤 */
  --verb:#1B62D6;   /* 動詞=青 */
  --gold:#E08A16;   /* バッジ */
  --done:#12946B;
  --shadow:0 1px 2px rgba(20,24,32,.05), 0 8px 24px rgba(20,24,32,.06);
  --r:14px;
  --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic",system-ui,sans-serif;
  --en:-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101216; --surface:#191C22; --surface-2:#22262E;
    --ink:#EDEFF3; --ink-2:#A6ADBA; --ink-3:#767D8A;
    --line:#2A2E37; --line-2:#3A404B;
    --subj:#FF6B7E; --verb:#6FA8FF; --gold:#F0B24B; --done:#3FD4A1;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--jp);
  font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--verb);outline-offset:2px;border-radius:6px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* ============ header ============ */
header{
  position:sticky;top:0;z-index:30;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.hbar{display:flex;align-items:center;gap:12px;height:54px}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;letter-spacing:.02em}
.brand .bolt{color:var(--gold);font-size:18px;transform:translateY(1px)}
.brand h1{font-size:17px;margin:0;font-weight:700}
.spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);font-size:17px}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

/* stats strip */
.stats{display:flex;gap:0;border-top:1px solid var(--line);}
.stat{flex:1;padding:8px 4px 10px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;line-height:1.2;letter-spacing:-.02em}
.stat span{font-size:10px;color:var(--ink-3);letter-spacing:.12em}
.stat.fire b{color:var(--gold)}
.stat.today b{color:var(--done)}

/* tabs */
nav.tabs{display:flex;gap:4px;padding:8px 0 10px}
.tab{flex:1;padding:9px 0;border-radius:10px;text-align:center;font-size:14px;font-weight:600;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ============ toolbar ============ */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 12px}
.search{flex:1;min-width:150px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 11px}
.search input{border:0;background:none;width:100%;outline:none;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--mono);opacity:.65;margin-left:5px;font-size:12px}
select.mini{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 9px;font-size:13px;color:var(--ink-2)}

/* ============ card ============ */
.list{display:flex;flex-direction:column;gap:10px;padding-bottom:120px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 14px 11px;position:relative}
.card.due{border-left:3px solid var(--gold)}
.card.new{border-left:3px solid var(--line-2)}
.pair{display:flex;flex-direction:column;gap:7px}
.list.side .pair{flex-direction:row;align-items:flex-start;gap:14px}
.list.side .jp,.list.side .en{flex:1;min-width:0}
.jp{font-size:16px;font-weight:600;letter-spacing:.01em;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.en{font-family:var(--en);font-size:16.5px;line-height:1.5;letter-spacing:.005em;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.list.side .en{border-left:2px solid var(--line);padding-left:12px}
.list.stack .en{padding-left:11px;border-left:2px solid var(--line)}
.en:empty::before{content:"英文が未入力";color:var(--ink-3);font-size:14px}
.masked .en{filter:blur(7px);opacity:.55;cursor:pointer;user-select:none}

.meta{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line);flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.badge.lv1{color:var(--done)} .badge.lv2{color:var(--gold)} .badge.lv3{color:var(--verb)}
.badge.lv4{color:var(--subj)} .badge.lv5{background:linear-gradient(90deg,var(--gold),var(--subj));color:#fff}
.last{font-size:12px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.02em}
.last.hot{color:var(--done)}
.last.due{color:var(--gold)}
.tag{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:2px 7px}
.card-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.did{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:7px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700}
.did.done{background:var(--surface-2);color:var(--done)}
.did:active{transform:scale(.96)}
.more{width:34px;height:34px;border-radius:8px;color:var(--ink-3);display:grid;place-items:center;font-size:16px}
.more:hover{background:var(--surface-2);color:var(--ink)}
.dots{display:flex;gap:3px;align-items:center;margin-left:2px}
.dot{width:6px;height:6px;border-radius:2px;background:var(--line-2)}
.dot.on{background:var(--done)}

@keyframes flash{0%{box-shadow:0 0 0 0 var(--done)}100%{box-shadow:0 0 0 14px transparent}}
.card.flash{animation:flash .45s ease-out}
@media (prefers-reduced-motion:reduce){.card.flash{animation:none}}

/* empty */
.empty{text-align:center;padding:60px 20px;color:var(--ink-3)}
.empty .big{font-size:34px;margin-bottom:10px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:6px}

/* ============ fab ============ */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + var(--safe-b));z-index:25;
  height:52px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;
  box-shadow:0 6px 20px rgba(0,0,0,.22);display:flex;align-items:center;gap:8px;
  transition:transform .2s cubic-bezier(.32,.72,0,1),opacity .2s}
.fab:active{transform:scale(.97)}
.fab.tuck{transform:translateY(150%);opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.fab{transition:none}}

/* ============ sheet / modal ============ */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.42);z-index:40;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s,visibility .18s}
.scrim.open{opacity:1;visibility:visible;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;
  max-height:92vh;overflow:auto;transform:translateY(101%);visibility:hidden;pointer-events:none;
  transition:transform .22s cubic-bezier(.32,.72,0,1),visibility .22s;
  padding-bottom:calc(18px + var(--safe-b));box-shadow:0 -8px 40px rgba(0,0,0,.2)}
.sheet.open{transform:translateY(0);visibility:visible;pointer-events:auto}
@media (min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:680px;max-height:86vh;border-radius:16px;
    transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform .18s,opacity .18s,visibility .18s}
  .sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible;pointer-events:auto}
}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.sheet-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);z-index:2}
.sheet-head h2{margin:0;font-size:16px;font-weight:700}
.sheet-body{padding:14px 16px 4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:6px;font-weight:600}
textarea,input.txt{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;outline:none;resize:vertical}
textarea:focus,input.txt:focus,.editor:focus{border-color:var(--verb)}
.editor{min-height:76px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 12px;
  font-family:var(--en);font-size:17px;line-height:1.55;outline:none;white-space:pre-wrap;word-break:break-word}
.editor:empty::before{content:attr(data-ph);color:var(--ink-3)}
.paint{display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap;align-items:center}
.pbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:700}
.pbtn .sw{width:10px;height:10px;border-radius:50%}
.pbtn.red{color:var(--subj)} .pbtn.red .sw{background:var(--subj)}
.pbtn.blue{color:var(--verb)} .pbtn.blue .sw{background:var(--verb)}
.pbtn.black{color:var(--ink)} .pbtn.black .sw{background:var(--ink)}
.pbtn:active{transform:scale(.96)}
.hint{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.sheet-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:9px}
.btn{flex:1;padding:12px;border-radius:11px;font-weight:700;font-size:15px;text-align:center;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--subj)}
.row{display:flex;gap:9px}
.row>*{flex:1}

/* menu list */
.menu{padding:6px}
.menu button{display:flex;align-items:center;gap:11px;width:100%;padding:13px 12px;border-radius:10px;font-size:15px;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--subj)}
.menu .sep{height:1px;background:var(--line);margin:6px 4px}
.menu .ttl{font-size:11px;color:var(--ink-3);letter-spacing:.1em;padding:10px 12px 4px;font-weight:700}
.switch{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}

/* ============ practice ============ */
.drill{padding:6px 0 120px}
.progress{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .25s}
.pcount{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-bottom:4px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px 20px;min-height:210px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.q-jp{font-size:22px;font-weight:700;line-height:1.55;letter-spacing:.01em;white-space:pre-wrap;word-break:break-word}
.q-en{font-family:var(--en);font-size:20px;line-height:1.5;white-space:pre-wrap;word-break:break-word;padding-top:16px;border-top:1px dashed var(--line)}
.reveal-btn{align-self:flex-start;padding:10px 18px;border-radius:999px;border:1px dashed var(--line-2);color:var(--ink-2);font-size:14px;font-weight:600}
.q-actions{display:flex;gap:10px;margin-top:16px}
.q-actions .btn{padding:15px}
.q-meta{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.result{text-align:center;padding:40px 16px}
.result .big{font-size:44px}
.result h3{margin:10px 0 4px;font-size:20px}
.result p{color:var(--ink-2);margin:0 0 22px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translate(-50%,10px);z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.2s;box-shadow:0 6px 22px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none !important}

/* ============ question mode ============ */
/* deck switch */
.deck{display:flex;gap:2px;background:var(--surface-2);border-radius:999px;padding:3px;margin:0 0 10px}
.deck button{flex:1;height:34px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--ink-3);transition:background .18s,color .18s,transform .12s}
.deck button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.deck button:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){.deck button{transition:none}}

/* question card (list) */
.qcard-item{display:flex;flex-direction:column}
.qbase{font-family:var(--en);font-size:16.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
u.tgt{text-decoration:underline;text-decoration-color:var(--subj);text-decoration-thickness:2px;text-underline-offset:3px;
  background:color-mix(in srgb,var(--subj) 12%,transparent);padding:0 2px;border-radius:3px;color:var(--ink)}
.cue-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:9px 0 8px}
.cue{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.cue.wh{color:var(--verb);background:color-mix(in srgb,var(--verb) 10%,transparent)}
.cue.yesno{color:var(--done);background:color-mix(in srgb,var(--done) 10%,transparent)}
.cue.tag{color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.cue.neg{color:var(--subj);background:color-mix(in srgb,var(--subj) 10%,transparent)}
.cue.choice{color:var(--verb);background:color-mix(in srgb,var(--verb) 10%,transparent);border:1px solid var(--line-2)}
.cue.indirect{color:var(--ink-2);background:color-mix(in srgb,var(--ink-2) 10%,transparent)}
.cue-txt{font-size:13px;color:var(--ink-2)}
.qans{font-family:var(--en);font-size:16.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;border-left:2px solid var(--verb);padding-left:11px}
.qans:empty::before{content:"模範解答が未入力";color:var(--ink-3);font-size:14px}
.qa{font-family:var(--en);font-size:13px;color:var(--ink-2);margin-top:6px;padding-left:13px;word-break:break-word}
.qa:empty{display:none}
.masked .qans,.masked .qa{filter:blur(7px);opacity:.55;cursor:pointer;user-select:none}

/* question drill */
.q-base{font-family:var(--en);font-size:20px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.q-ans{font-family:var(--en);font-size:20px;line-height:1.5;white-space:pre-wrap;word-break:break-word;padding-top:16px;border-top:1px dashed var(--line)}
.q-a{font-family:var(--en);font-size:15px;color:var(--ink-2);margin-top:-6px;word-break:break-word}
.qcard .cue-row{margin:2px 0 0}

/* hint */
.hintbtn{align-self:flex-start;padding:7px 14px;border-radius:999px;border:1px dashed var(--line-2);color:var(--ink-3);font-size:13px;font-weight:600}
.hintword{font-family:var(--en);font-size:18px;font-weight:700;color:var(--verb);letter-spacing:.01em}

/* kind chips */
.kinds{display:flex;gap:6px;flex-wrap:wrap}
.kchip{white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2)}
.kchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kchip:active{transform:scale(.96)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hbar">
      <div class="brand"><span class="bolt">⚡</span><h1>瞬間英作文</h1></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="btnLayout" title="表示切替（縦／横）">▤</button>
      <button class="icon-btn" id="btnMenu" title="メニュー">☰</button>
    </div>
  </div>
  <div class="wrap"><div class="stats">
    <div class="stat today"><b id="sToday">0</b><span>きょう</span></div>
    <div class="stat fire"><b id="sStreak">0</b><span>連続</span></div>
    <div class="stat"><b id="sTotal">0</b><span>合計</span></div>
    <div class="stat"><b id="sCount">0</b><span id="sCountLabel">文の数</span></div>
  </div></div>
  <div class="wrap"><nav class="tabs" role="tablist">
    <button class="tab" id="tabList" role="tab" aria-selected="true">リスト</button>
    <button class="tab" id="tabDrill" role="tab" aria-selected="false">練習モード</button>
  </nav></div>
</header>

<main class="wrap">
  <!-- ===== DECK SWITCH ===== -->
  <div class="deck" id="deck" role="tablist">
    <button data-deck="w" aria-pressed="true">⚡ 英作文</button>
    <button data-deck="q" aria-pressed="false">❓ 疑問文</button>
  </div>

  <!-- ===== LIST ===== -->
  <section id="viewList">
    <div class="toolbar">
      <div class="search">
        <span style="color:var(--ink-3)">⌕</span>
        <input id="q" type="search" placeholder="日本語・英語・タグで検索" autocomplete="off">
      </div>
      <select class="mini" id="sort">
        <option value="new">新しい順</option>
        <option value="old">古い順</option>
        <option value="weak">苦手順（回数が少ない）</option>
        <option value="stale">ごぶさた順</option>
        <option value="rand">シャッフル</option>
      </select>
    </div>
    <div class="chips" id="filters"></div>
    <div class="list stack" id="list"></div>
  </section>

  <!-- ===== DRILL ===== -->
  <section id="viewDrill" class="hidden">
    <div class="drill" id="drillArea"></div>
  </section>
</main>

<button class="fab" id="fab">＋ 文を追加</button>

<div class="scrim" id="scrim"></div>

<!-- editor sheet -->
<div class="sheet" id="editSheet" role="dialog" aria-modal="true">
  <div class="sheet-head">
    <h2 id="editTitle">文を追加</h2><div class="spacer" style="flex:1"></div>
    <button class="icon-btn" data-close>✕</button>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label>日本語</label>
      <textarea id="fJp" rows="2" placeholder="例）私は毎朝コーヒーを飲みます。"></textarea>
    </div>
    <div class="field">
      <label>英語（主語＝赤／動詞＝青）</label>
      <div class="paint">
        <button class="pbtn red" data-color="subj" data-for="fEn"><i class="sw"></i>主語</button>
        <button class="pbtn blue" data-color="verb" data-for="fEn"><i class="sw"></i>動詞</button>
        <button class="pbtn black" data-color="ink" data-for="fEn"><i class="sw"></i>黒</button>

<script>
/* =====================================================================
   瞬間英作文 / Instant Composition Drill
   A: データ層  B: 画面  C: 色エディタ  D: バッジ＆練習
   ===================================================================== */

/* ---------- A. data layer ---------- */
const KEY = 'shunkan.v1';
const todayStr = () => new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD (local)
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const clone = o => JSON.parse(JSON.stringify(o));
const DEFAULT = {
  v: 2, items: [], qitems: [], days: {},
  settings: { layout: 'stack', mask: false, deck: 'w', sort: 'new', filter: 'all', qsort: 'new', qfilter: 'all' }
};
let DB = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return clone(DEFAULT);
    const d = JSON.parse(raw);
    const out = Object.assign(clone(DEFAULT), d, { settings: Object.assign({}, DEFAULT.settings, d.settings || {}) });
    if (!Array.isArray(out.items)) out.items = [];
    if (!Array.isArray(out.qitems)) out.qitems = [];   // v1 のデータには疑問文デッキが無い
    out.v = DEFAULT.v;
    return out;
  } catch (e) { return clone(DEFAULT); }
}

/* デッキ（⚡英作文 / ❓疑問文）。設定は並び順・絞り込みだけデッキ別に持つ */
const isQ = () => DB.settings.deck === 'q';
const deckItems = () => isQ() ? DB.qitems : DB.items;
const getFilter = () => isQ() ? DB.settings.qfilter : DB.settings.filter;
const setFilter = v => { if (isQ()) DB.settings.qfilter = v; else DB.settings.filter = v; };
const getSort = () => isQ() ? DB.settings.qsort : DB.settings.sort;
const setSort = v => { if (isQ()) DB.settings.qsort = v; else DB.settings.sort = v; };
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(DB)); }
    catch (e) { toast('保存できませんでした（容量不足かも）'); }
  }, 120);
}

function addItem(jp, en, tags = [], note = '') {
  const it = { id: uid(), jp: jp.trim(), en: en, tags, note, count: 0, last: null, hist: [], created: Date.now() };
  DB.items.unshift(it); save(); return it;
}
function getItem(id) { return DB.items.find(i => i.id === id) || DB.qitems.find(i => i.id === id); }
function removeItem(id) {
  DB.items = DB.items.filter(i => i.id !== id);
  DB.qitems = DB.qitems.filter(i => i.id !== id);
  save();
}

/* ---------- A-Q. 疑問文モードのデータ ---------- */
const KINDS = [
  { k: 'wh',       name: 'Wh疑問文',    cue: '下線部をたずねる疑問文に',        ph: 'Where did Tom go last summer?' },
  { k: 'yesno',    name: 'Yes/No疑問文', cue: 'Yes / No で答える疑問文に',      ph: 'Does Yuki play the guitar?' },
  { k: 'tag',      name: '付加疑問文',   cue: '付加疑問文に（〜だよね？）',      ph: "It's cold today, isn't it?" },
  { k: 'neg',      name: '否定疑問文',   cue: '否定疑問文に（〜じゃないの？）',  ph: "Don't you like natto?" },
  { k: 'choice',   name: '選択疑問文',   cue: '選択疑問文に（A か B か）',       ph: 'Do you want tea or coffee?' },
  { k: 'indirect', name: '間接疑問文',   cue: '間接疑問文に（Do you know 〜?）', ph: 'Do you know where Ken lives?' }
];
const kindOf = k => KINDS.find(x => x.k === k) || KINDS[0];

function addQ(o) {
  const it = {
    id: uid(), type: 'q',
    base: (o.base || '').trim(),
    target: (o.target || '').trim(),
    kind: KINDS.some(x => x.k === o.kind) ? o.kind : 'wh',
    q: o.q || '', a: (o.a || '').trim(),
    tags: (o.tags || []).slice(), note: o.note || '',
    count: 0, last: null, hist: [], created: Date.now()
  };
  DB.qitems.unshift(it); save(); return it;
}

/* 素材文の中の「たずねる部分」に下線を引く。esc 後の文字列どうしで探すのでズレない */
function baseHTML(it) {
  const b = esc(it.base || ''), t = esc((it.target || '').trim());
  if (!t) return b;
  const i = b.indexOf(t);
  return i < 0 ? b : b.slice(0, i) + '<u class="tgt">' + t + '</u>' + b.slice(i + t.length);
}
function cueText(it) {
  const kd = kindOf(it.kind);
  if (it.kind === 'wh' && it.target) return `下線部「${it.target}」をたずねる`;
  return kd.cue;
}
/* 模範解答の出だし（ヒント用）。疑問詞は2語まとめて見せる */
function leadWords(html) {
  const w = plain(html).split(/\s+/).filter(Boolean);
  if (!w.length) return '';
  const two = /^(how|what|which|whose|at|in|on|for|to|by|about|from)$/i.test(w[0].replace(/[^A-Za-z]/g, ''));
  return w.slice(0, two && w.length > 1 ? 2 : 1).join(' ');
}
/* 模範解答から出題タイプを推測する（まとめて追加で使用） */
function guessKind(qs) {
  const s = plain(qs).trim(), l = s.toLowerCase();
  if (/^(do you know|does anyone know|could you tell me|can you tell me|i wonder|do you remember)\b/.test(l)) return 'indirect';
  if (/,\s*(is|are|was|were|do|does|did|can|could|will|would|should|has|have|had)\s*(n't)?\s+\w+\s*\?$/i.test(s)) return 'tag';
  if (/\bor\b/.test(l)) return 'choice';
  if (/^(don't|doesn't|didn't|isn't|aren't|wasn't|weren't|can't|couldn't|won't|wouldn't|shouldn't|haven't|hasn't|hadn't)\b/.test(l)) return 'neg';
  if (/^(what|who|whose|which|where|when|why|how)\b/.test(l)) return 'wh';
  return 'yesno';
}

function markDone(id) {
  const it = getItem(id); if (!it) return;
  const t = todayStr();
  it.count++; it.last = t;
  it.hist.push(t); if (it.hist.length > 60) it.hist = it.hist.slice(-60);
  DB.days[t] = (DB.days[t] || 0) + 1;
  save();
}
function undoDone(id) {
  const it = getItem(id); if (!it || !it.count) return;
  const t = todayStr();
  if (it.hist[it.hist.length - 1] === t) {
    it.hist.pop(); it.count--;
    it.last = it.hist.length ? it.hist[it.hist.length - 1] : null;
    DB.days[t] = Math.max(0, (DB.days[t] || 1) - 1);
    if (!DB.days[t]) delete DB.days[t];
    save();
  }
}

/* 日付ユーティリティ */
function daysAgo(dateStr) {
  if (!dateStr) return null;
  const a = new Date(dateStr + 'T00:00:00'), b = new Date(todayStr() + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
function relLabel(dateStr) {
  const d = daysAgo(dateStr);
  if (d === null) return '未練習';
  if (d === 0) return '今日';
  if (d === 1) return '昨日';
  if (d < 7) return d + '日前';
  const [, m, dd] = dateStr.split('-');
  return `${+m}/${+dd}`;
}
function streak() {
  let n = 0; const d = new Date();
  if (!DB.days[todayStr()]) d.setDate(d.getDate() - 1); // 今日まだでも昨日まで続いていれば継続中
  for (;;) {
    const k = d.toLocaleDateString('sv-SE');
    if (DB.days[k]) { n++; d.setDate(d.getDate() - 1); } else break;
  }
  return n;
}

/* ---------- D-1. badge ---------- */
const LEVELS = [
  { min: 0,  cls: '',    icon: '·',  name: 'NEW' },
  { min: 1,  cls: 'lv1', icon: '🌱', name: 'Lv.1' },
  { min: 3,  cls: 'lv2', icon: '🔥', name: 'Lv.2' },
  { min: 6,  cls: 'lv3', icon: '⭐', name: 'Lv.3' },
  { min: 12, cls: 'lv4', icon: '💎', name: 'Lv.4' },
  { min: 24, cls: 'lv5', icon: '👑', name: 'MASTER' }
];
function levelOf(c) { let l = LEVELS[0]; for (const x of LEVELS) if (c >= x.min) l = x; return l; }
function nextGap(c) { const nx = LEVELS.find(x => x.min > c); return nx ? nx.min - c : 0; }
const isDue = it => it.count > 0 && daysAgo(it.last) >= 3;
const doneToday = it => it.last === todayStr();

/* ---------- A-Q2. お手本の問題（プリセット） ---------- */
const PRESET_Q = [
  {"base":"Tom is a soccer player.","target":"a soccer player","kind":"wh","q":"What is Tom?","a":"He is a soccer player.","note":"be動詞の疑問文は主語と be 動詞をひっくり返すだけ。職業や身分をたずねるときは What を使います。","tags":["Wh疑問文","be動詞"]},
  {"base":"Mika lives in Osaka.","target":"in Osaka","kind":"wh","q":"Where does Mika live?","a":"She lives in Osaka.","note":"lives の s は does に移ります。does の後ろの動詞は必ず原形 live に戻しましょう。","tags":["Wh疑問文","三単現"]},
  {"base":"Ken gets up at six every morning.","target":"at six","kind":"wh","q":"What time does Ken get up every morning?","a":"He gets up at six.","note":"時刻をたずねるときは What time。gets → does + 原形 get の形にします。","tags":["Wh疑問文","三単現"]},
  {"base":"Yuki went to the library yesterday.","target":"to the library","kind":"wh","q":"Where did Yuki go yesterday?","a":"She went to the library.","note":"過去形 went は did に過去の意味を渡し、動詞は原形 go に戻します。","tags":["Wh疑問文","過去形"]},
  {"base":"This bag is Mika's.","target":"Mika's","kind":"wh","q":"Whose bag is this?","a":"It is Mika's.","note":"持ち主をたずねるときは Whose + 名詞 を文の先頭にまとめて置きます。","tags":["Wh疑問文","be動詞"]},
  {"base":"Tom has two dogs.","target":"two dogs","kind":"wh","q":"How many dogs does Tom have?","a":"He has two.","note":"数をたずねるときは How many + 複数名詞。has → does + 原形 have になります。","tags":["Wh疑問文","三単現"]},
  {"base":"Ken is reading a comic book now.","target":"a comic book","kind":"wh","q":"What is Ken reading now?","a":"He is reading a comic book.","note":"進行形は be 動詞を主語の前に出すだけ。-ing はそのまま残します。","tags":["Wh疑問文","進行形"]},
  {"base":"Mika was absent because she had a cold.","target":"because she had a cold","kind":"wh","q":"Why was Mika absent?","a":"Because she had a cold.","note":"理由をたずねるのは Why。答えは Because 〜 で返すのが自然です。","tags":["Wh疑問文","過去形"]},
  {"base":"Yuki broke the window.","target":"Yuki","kind":"wh","q":"Who broke the window?","a":"Yuki did.","note":"疑問詞が主語になるパターンです。Who をそのまま主語の位置に置くだけで、did は使わず語順も変えません。","tags":["Wh疑問文","疑問詞が主語"]},
  {"base":"That noise woke the baby.","target":"That noise","kind":"wh","q":"What woke the baby?","a":"That noise did.","note":"What が主語なので語順はそのまま。動詞は過去形 woke のままで、did は入れません。","tags":["Wh疑問文","疑問詞が主語"]},
  {"base":"Ten students joined the club.","target":"Ten students","kind":"wh","q":"How many students joined the club?","a":"Ten students did.","note":"How many students が主語になるパターン。語順は平叙文のままで、動詞も joined のままです。","tags":["Wh疑問文","疑問詞が主語"]},
  {"base":"Tom's sister lives in Canada.","target":"Tom's sister","kind":"wh","q":"Who lives in Canada?","a":"Tom's sister does.","note":"Who が主語なので does は使わず、動詞は三単現の lives のまま残します。","tags":["Wh疑問文","疑問詞が主語"]},
  {"base":"Mika will visit her grandmother next Sunday.","target":"next Sunday","kind":"wh","q":"When will Mika visit her grandmother?","a":"Next Sunday.","note":"will の文は will を主語の前に出します。will の後ろは必ず原形 visit です。","tags":["Wh疑問文","未来"]},
  {"base":"Ken is going to study math tonight.","target":"math","kind":"wh","q":"What is Ken going to study tonight?","a":"He is going to study math.","note":"be going to は be 動詞だけを前に出します。going to study の部分は動かしません。","tags":["Wh疑問文","未来"]},
  {"base":"Yuki can play the piano very well.","target":"the piano","kind":"wh","q":"What can Yuki play very well?","a":"She can play the piano.","note":"助動詞 can は主語の前へ。can の後ろの動詞は原形 play のままです。","tags":["Wh疑問文","助動詞"]},
  {"base":"Tom stayed in London for three weeks.","target":"for three weeks","kind":"wh","q":"How long did Tom stay in London?","a":"For three weeks.","note":"期間をたずねるのは How long。stayed → did + 原形 stay に戻します。","tags":["Wh疑問文","過去形"]},
  {"base":"This T-shirt costs fifteen dollars.","target":"fifteen dollars","kind":"wh","q":"How much does this T-shirt cost?","a":"Fifteen dollars.","note":"値段をたずねるのは How much。costs の s は does に渡し、動詞は原形 cost にします。","tags":["Wh疑問文","三単現"]},
  {"base":"Mika practices tennis three times a week.","target":"three times a week","kind":"wh","q":"How often does Mika practice tennis?","a":"Three times a week.","note":"頻度をたずねるのは How often。practices → does + 原形 practice です。","tags":["Wh疑問文","三単現"]},
  {"base":"Ken came to school by bike.","target":"by bike","kind":"wh","q":"How did Ken come to school?","a":"By bike.","note":"手段をたずねるのは How。came → did + 原形 come に戻すのを忘れずに。","tags":["Wh疑問文","過去形"]},
  {"base":"Yuki likes the blue one better.","target":"the blue one","kind":"wh","q":"Which one does Yuki like better?","a":"She likes the blue one.","note":"限られた選択肢から選ばせるときは Which。likes → does + 原形 like です。","tags":["Wh疑問文","三単現"]},
  {"base":"Tom has lived in Japan for five years.","target":"for five years","kind":"wh","q":"How long has Tom lived in Japan?","a":"For five years.","note":"現在完了は has を主語の前に出すだけ。lived（過去分詞）はそのまま残します。","tags":["Wh疑問文","現在完了"]},
  {"base":"Mika has already finished her homework.","target":"her homework","kind":"wh","q":"What has Mika already finished?","a":"Her homework.","note":"疑問詞 + has + 主語 + 過去分詞 の語順。already の位置は動かさなくて大丈夫です。","tags":["Wh疑問文","現在完了"]},
  {"base":"This temple was built in 1650.","target":"in 1650","kind":"wh","q":"When was this temple built?","a":"It was built in 1650.","note":"受動態は be 動詞を主語の前に出します。過去分詞 built はそのままの位置です。","tags":["Wh疑問文","受動態"]},
  {"base":"This song was written by Ken.","target":"by Ken","kind":"wh","q":"Who was this song written by?","a":"It was written by Ken.","note":"by 以下をたずねる受動態の疑問文。by を文末に残す形が会話では自然です（By whom 〜? は硬い言い方）。","tags":["Wh疑問文","受動態"]},
  {"base":"There are twelve eggs in the box.","target":"twelve eggs","kind":"wh","q":"How many eggs are there in the box?","a":"There are twelve.","note":"there is / are 構文では are を there の前に出して How many 〜 are there? の形にします。","tags":["Wh疑問文","there is構文"]},
  {"base":"Yuki must finish the report by Friday.","target":"by Friday","kind":"wh","q":"When must Yuki finish the report?","a":"By Friday.","note":"must も助動詞なので主語の前へ。後ろの動詞は原形 finish のままです。","tags":["Wh疑問文","助動詞"]},
  {"base":"Tom was waiting for his friend at the station.","target":"for his friend","kind":"wh","q":"Who was Tom waiting for at the station?","a":"He was waiting for his friend.","note":"過去進行形は was を主語の前へ。前置詞 for は文中に残したまま Who を先頭に置きます。","tags":["Wh疑問文","進行形"]},
  {"base":"Mika bought that dress at the new shop.","target":"at the new shop","kind":"wh","q":"Where did Mika buy that dress?","a":"At the new shop.","note":"bought → did + 原形 buy。過去形を原形に戻し忘れるミスが最も多いので注意しましょう。","tags":["Wh疑問文","過去形"]},
  {"base":"Ken is from Australia.","target":"","kind":"yesno","q":"Is Ken from Australia?","a":"Yes, he is.","note":"be動詞の文は主語と be 動詞をひっくり返すだけで疑問文になります。","tags":["Yes/No疑問文","be動詞"]},
  {"base":"Yuki plays the guitar.","target":"","kind":"yesno","q":"Does Yuki play the guitar?","a":"Yes, she does.","note":"三単現の s は does に移ります。does の後ろは原形 play です。","tags":["Yes/No疑問文","三単現"]},
  {"base":"You like natto.","target":"","kind":"yesno","q":"Do you like natto?","a":"No, I don't.","note":"主語が you のときは Do を文頭に置くだけ。動詞はそのまま原形です。","tags":["Yes/No疑問文","一般動詞"]},
  {"base":"Tom watched the game last night.","target":"","kind":"yesno","q":"Did Tom watch the game last night?","a":"Yes, he did.","note":"過去の文は Did を文頭に。watched は原形 watch に戻します。","tags":["Yes/No疑問文","過去形"]},
  {"base":"Mika is cooking dinner now.","target":"","kind":"yesno","q":"Is Mika cooking dinner now?","a":"Yes, she is.","note":"進行形は be 動詞を先頭に出すだけ。cooking はそのままです。","tags":["Yes/No疑問文","進行形"]},
  {"base":"Ken can swim fast.","target":"","kind":"yesno","q":"Can Ken swim fast?","a":"Yes, he can.","note":"助動詞 can を主語の前に出すだけ。動詞は原形 swim のままです。","tags":["Yes/No疑問文","助動詞"]},
  {"base":"There is a post office near the station.","target":"","kind":"yesno","q":"Is there a post office near the station?","a":"Yes, there is.","note":"there is 構文は is を there の前に出します。答えも Yes, there is. の形で返します。","tags":["Yes/No疑問文","there is構文"]},

/* ---------- C. sanitize + editor ---------- */
const COLORVAR = { subj: 'var(--subj)', verb: 'var(--verb)', ink: 'var(--ink)' };
const COLORHEX = { subj: '#E0334B', verb: '#1B62D6', ink: '' };

/** 許可するのは span[data-c] と改行のみ。色は data-c 属性で保存し、表示時に CSS 変数へ写す（ダークモード対応） */
function sanitize(html) {
  const box = document.createElement('div');
  box.innerHTML = html;
  const out = document.createElement('div');
  (function walk(src, dst) {
    src.childNodes.forEach(n => {
      if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.nodeValue)); return; }
      if (n.nodeType !== 1) return;
      const tag = n.tagName.toLowerCase();
      if (tag === 'br') { dst.appendChild(document.createElement('br')); return; }
      let c = n.dataset ? n.dataset.c : null;
      if (!c) {
        const col = (n.getAttribute && (n.getAttribute('color') || '')) + ' ' + (n.style ? n.style.color : '');
        const s = col.toLowerCase();
        if (s.includes('224, 51, 75') || s.includes('#e0334b') || s.includes('--subj')) c = 'subj';
        else if (s.includes('27, 98, 214') || s.includes('#1b62d6') || s.includes('--verb')) c = 'verb';
      }
      let dstNext = dst;
      if (c === 'subj' || c === 'verb') {
        const sp = document.createElement('span');
        sp.dataset.c = c; sp.style.color = COLORVAR[c];
        dst.appendChild(sp); dstNext = sp;
      } else if (tag === 'div' || tag === 'p') {
        if (dst.childNodes.length) dst.appendChild(document.createElement('br'));
      }
      walk(n, dstNext);
    });
  })(box, out);
  return out.innerHTML.replace(/(<br>)+$/, '');
}
const plain = html => { const d = document.createElement('div'); d.innerHTML = html || ''; return (d.textContent || '').trim(); };

const fEn = document.getElementById('fEn');
let savedRange = null, activeEditor = null;
const editorOf = n => { while (n) { if (n.nodeType === 1 && n.classList.contains('editor')) return n; n = n.parentNode; } return null; };
document.addEventListener('selectionchange', () => {
  const s = window.getSelection();
  if (!s || !s.rangeCount) return;
  const ed = editorOf(s.anchorNode);
  if (ed) { activeEditor = ed; savedRange = s.getRangeAt(0).cloneRange(); }
});
function paint(kind, ed) {
  ed = ed || activeEditor || fEn;
  ed.focus();
  const sel = window.getSelection();
  if (savedRange && activeEditor === ed && (!sel.rangeCount || sel.isCollapsed || !ed.contains(sel.anchorNode))) {
    sel.removeAllRanges(); sel.addRange(savedRange);
  }
  if (!sel.rangeCount || sel.isCollapsed || !ed.contains(sel.anchorNode)) { toast('色をつけたい部分を選んでからタップ'); return; }
  const range = sel.getRangeAt(0);
  const frag = range.extractContents();
  // 既存の色指定を一度はがす
  frag.querySelectorAll && frag.querySelectorAll('span[data-c]').forEach(sp => {
    while (sp.firstChild) sp.parentNode.insertBefore(sp.firstChild, sp);
    sp.remove();
  });
  let node;
  if (kind === 'ink') { node = frag; }
  else { const sp = document.createElement('span'); sp.dataset.c = kind; sp.style.color = COLORVAR[kind]; sp.appendChild(frag); node = sp; }
  range.insertNode(node);
  sel.removeAllRanges();
  const r = document.createRange();
  r.selectNodeContents(node.nodeType === 1 ? node : ed);
  sel.addRange(r); savedRange = r.cloneRange(); activeEditor = ed;
  ed.normalize();
}
document.querySelectorAll('.pbtn').forEach(b => {
  const ed = document.getElementById(b.dataset.for) || fEn;
  b.addEventListener('pointerdown', e => e.preventDefault());
  b.addEventListener('click', () => paint(b.dataset.color, ed));
});
document.querySelectorAll('.editor').forEach(ed => {
  ed.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && ['1', '2', '3'].includes(e.key)) {
      e.preventDefault(); paint({ '1': 'subj', '2': 'verb', '3': 'ink' }[e.key], ed);
    }
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      if (ed.closest('#qSheet')) saveQEditor(); else saveEditor();
    }
  });
  ed.addEventListener('paste', e => {
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, t);
  });
});

function saveEditor() {
  const jp = $('#fJp').value.trim();

/* ---------- B-2. list render ---------- */
const listEl = $('#list');
let shuffleSeed = Math.random();

const searchText = i => (i.type === 'q'
  ? [i.base, plain(i.q), i.a, kindOf(i.kind).name, i.target]
  : [i.jp, plain(i.en)]
).concat((i.tags || []).join(' '), i.note || '').join(' ');

function currentSet() {
  const q = $('#q').value.trim().toLowerCase();
  const f = getFilter();
  let arr = deckItems().slice();
  if (q) arr = arr.filter(i => searchText(i).toLowerCase().includes(q));
  if (f === 'todo') arr = arr.filter(i => !doneToday(i));
  else if (f === 'due') arr = arr.filter(i => isDue(i));
  else if (f === 'new') arr = arr.filter(i => !i.count);
  else if (f && f.startsWith('kind:')) { const k = f.slice(5); arr = arr.filter(i => i.kind === k); }
  else if (f && f.startsWith('tag:')) { const t = f.slice(4); arr = arr.filter(i => (i.tags || []).includes(t)); }
  const s = getSort();
  if (s === 'new') arr.sort((a, b) => b.created - a.created);
  else if (s === 'old') arr.sort((a, b) => a.created - b.created);
  else if (s === 'weak') arr.sort((a, b) => a.count - b.count || a.created - b.created);
  else if (s === 'stale') { const st = i => (i.last === null ? 9999 : daysAgo(i.last)); arr.sort((a, b) => st(b) - st(a)); }
  else if (s === 'rand') arr.sort(() => Math.random() - .5);
  return arr;
}

/* カード下部の共通メタ行 */
function metaHTML(it) {
  const lv = levelOf(it.count), done = doneToday(it), due = isDue(it);
  const last = `<span class="last ${done ? 'hot' : (due ? 'due' : '')}">${it.count ? '最終 ' + relLabel(it.last) : '未練習'}</span>`;
  const tags = (it.tags || []).map(t => `<span class="tag">#${esc(t)}</span>`).join('');
  return `<div class="meta">
      <span class="badge ${lv.cls}">${lv.icon} ${lv.name}<span style="opacity:.6">×${it.count}</span></span>
      ${last}${weekDots(it)}${tags}
      <span class="card-actions">
        <button class="more" data-act="more">⋯</button>
        <button class="did ${done ? 'done' : ''}" data-act="did">${done ? '✓ 今日OK' : '⚡ できた'}</button>
      </span>
    </div>`;
}
const cardCls = it => {
  const done = doneToday(it), due = isDue(it);
  return ['card', done ? '' : (due ? 'due' : (it.count ? '' : 'new')), DB.settings.mask ? 'masked' : ''].join(' ');
};

function cardHTML(it) {
  return `<article class="${cardCls(it)}" data-id="${it.id}">
    <div class="pair">
      <div class="jp">${esc(it.jp) || '<span style="color:var(--ink-3)">（日本語なし）</span>'}</div>
      <div class="en">${it.en || ''}</div>
    </div>
    ${metaHTML(it)}
  </article>`;
}

function qCardHTML(it) {
  const kd = kindOf(it.kind);
  return `<article class="${cardCls(it)} qcard-item" data-id="${it.id}">
    <div class="qbase">${baseHTML(it)}</div>
    <div class="cue-row">
      <span class="cue ${kd.k}">${esc(kd.name)}</span>
      <span class="cue-txt">${esc(cueText(it))}</span>
    </div>
    <div class="qans">${it.q || ''}</div>
    <div class="qa">${esc(it.a || '')}</div>
    ${metaHTML(it)}
  </article>`;
}
function weekDots(it) {
  let h = '<span class="dots" title="直近7日">';
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = d.toLocaleDateString('sv-SE');
    h += `<i class="dot ${it.hist.includes(k) ? 'on' : ''}"></i>`;
  }
  return h + '</span>';
}
const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderFilters() {
  const src = deckItems(), cur = getFilter();
  const tagSet = new Map();
  src.forEach(i => (i.tags || []).forEach(t => tagSet.set(t, (tagSet.get(t) || 0) + 1)));
  let base = [
    ['all', 'すべて', src.length],
    ['todo', '今日まだ', src.filter(i => !doneToday(i)).length],
    ['due', '復習おすすめ', src.filter(isDue).length],
    ['new', '未練習', src.filter(i => !i.count).length]
  ];
  if (isQ()) base = base.concat(
    KINDS.map(k => ['kind:' + k.k, k.name, src.filter(i => i.kind === k.k).length]).filter(x => x[2])
  );
  const tags = [...tagSet.entries()].sort((a, b) => b[1] - a[1]).map(([t, n]) => ['tag:' + t, '#' + t, n]);
  $('#filters').innerHTML = base.concat(tags).map(([k, label, n]) =>
    `<button class="chip" data-f="${esc(k)}" aria-pressed="${cur === k}">${esc(label)}<span class="n">${n}</span></button>`).join('');
}

function renderStats() {

/* ---------- B-Q. デッキ切替 ---------- */
function setDeck(d) {
  if (DB.settings.deck === d) return;
  DB.settings.deck = d; save();
  drill = null;
  $('#q').value = '';        // 検索語はデッキごとに持ち越さない
  paintDeck();
  if ($('#viewDrill').classList.contains('hidden')) render(); else renderDrill();
}
function paintDeck() {
  const q = isQ();
  $('#deck').querySelectorAll('[data-deck]').forEach(b => b.setAttribute('aria-pressed', b.dataset.deck === DB.settings.deck));
  $('#fab').textContent = q ? '＋ 問題を追加' : '＋ 文を追加';
  $('#q').placeholder = q ? '英文・疑問文・タグで検索' : '日本語・英語・タグで検索';

}
$('#deck').addEventListener('click', e => {
  const b = e.target.closest('[data-deck]'); if (!b) return;
  setDeck(b.dataset.deck);
});

listEl.addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const id = card.dataset.id;
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'did') {
    if (doneToday(getItem(id))) { undoDone(id); toast('今日の記録を取り消しました'); }
    else { markDone(id); card.classList.add('flash'); toast('⚡ 記録しました'); }

  }

});

$('#q').addEventListener('input', render);
$('#sort').addEventListener('change', e => { setSort(e.target.value); save(); render(); });
$('#filters').addEventListener('click', e => {

});
$('#btnLayout').addEventListener('click', () => {

/* お手本の問題（プリセット）を読み込む。素材文が同じものは飛ばす */
function loadPreset() {
  const have = new Set(DB.qitems.map(i => i.base));
  const fresh = PRESET_Q.filter(p => !have.has(p.base));
  if (!fresh.length) { closeSheets(); toast('お手本の問題はすべて入っています'); return; }
  if (!confirm(`お手本の問題を ${fresh.length} 問追加します。よろしいですか？`)) return;
  fresh.slice().reverse().forEach(p => addQ({ ...p, q: esc(p.q) }));
  closeSheets(); render(); toast(fresh.length + ' 問を追加しました');
}

function doExport() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `瞬間英作文_${todayStr()}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  closeSheets(); toast('バックアップを書き出しました');
}
function doText() {
  const txt = isQ()
    ? DB.qitems.map(i => [i.base, plain(i.q), i.target || '', i.a || ''].join('\t')).join('\n')
    : DB.items.map(i => `${i.jp}\t${plain(i.en)}`).join('\n');
  const blob = new Blob([txt], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `瞬間英作文_${todayStr()}.txt`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  closeSheets(); toast('テキストで書き出しました');
}
function doImport() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d.items && !d.qitems) throw 0;
        const mode = confirm('OK＝今のデータに追加 ／ キャンセル＝すべて置きかえ');
        if (mode) {
          const ids = new Set(DB.items.concat(DB.qitems).map(i => i.id));
          (d.items || []).forEach(i => { if (ids.has(i.id)) i.id = uid(); DB.items.unshift(i); });
          (d.qitems || []).forEach(i => { if (ids.has(i.id)) i.id = uid(); i.type = 'q'; DB.qitems.unshift(i); });
          Object.entries(d.days || {}).forEach(([k, v]) => DB.days[k] = (DB.days[k] || 0) + v);
        } else {
          DB = Object.assign(clone(DEFAULT), d, { settings: Object.assign({}, DEFAULT.settings, d.settings || {}) });
          if (!Array.isArray(DB.items)) DB.items = [];
          if (!Array.isArray(DB.qitems)) DB.qitems = [];
        }
        save(); closeSheets(); paintDeck(); render(); toast('読み込みました');
      } catch (e) { toast('読み込めませんでした'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ---------- D-2. practice mode ---------- */
let drill = null;
function startDrill(opts) {
  const q = isQ();
  let arr = currentSet();
  if (opts.only === 'todo') arr = arr.filter(i => !doneToday(i));
  if (opts.only === 'due') arr = arr.filter(i => isDue(i) || !i.count);
  if (q && opts.kind && opts.kind !== 'all') arr = arr.filter(i => i.kind === opts.kind);
  if (opts.order === 'rand') arr = arr.sort(() => Math.random() - .5);
  if (opts.order === 'weak') arr = arr.sort((a, b) => a.count - b.count);
  if (!arr.length) { toast(q ? '対象の問題がありません' : '対象の文がありません'); return; }
  drill = { queue: arr.map(i => i.id), i: 0, ok: 0, again: 0, shown: false, hint: false, deck: DB.settings.deck, dir: opts.dir };
  renderDrill();
}
function renderDrill() {

      : `<div class="field"><label>出す方向</label>
        <div class="row">
          <button class="btn" data-o="dir:jp2en">日本語 → 英語</button>
          <button class="btn" data-o="dir:en2jp">英語 → 日本語</button>

      <button class="btn primary" id="goDrill" style="padding:15px">⚡ 開始する</button>
    </div>
    <div class="hint" style="text-align:center;margin-top:14px">リストの検索・フィルタもそのまま反映されます</div>`;
    const opt = q
      ? (window.__qDrillOpt = window.__qDrillOpt || { only: 'all', order: 'list', kind: 'all' })
      : (window.__drillOpt = window.__drillOpt || { only: 'all', order: 'list', dir: 'jp2en' });
    const unit = q ? '問題' : '文';
    const paintOpt = () => {
      el.querySelectorAll('[data-o]').forEach(b => {

      });
      $('#oOnly').textContent = { all: '登録した全部から', todo: `今日まだやっていない${unit}だけ`, due: `3日以上あいた${unit}＋未練習の${unit}` }[opt.only];
      $('#oOrder').textContent = { list: 'リストの並び順のまま', rand: '毎回ランダム', weak: `回数の少ない${unit}から` }[opt.order];

      <div class="big">${drill.again === 0 ? '👑' : (drill.ok >= drill.again ? '⚡' : '🌱')}</div>
      <h3>${drill.ok} ${q ? '問' : '文'}クリア</h3>
      <p>もう一回：${drill.again} ${q ? '問' : '文'}／全 ${total} ${q ? '問' : '文'}<br>今日の合計 ${DB.days[todayStr()] || 0} 回・連続 ${streak()} 日</p>
      <div class="row" style="max-width:400px;margin:0 auto">
        <button class="btn" id="drillAgain">もう一周</button>
        <button class="btn primary" id="drillEnd">終わる</button>
      </div></div>`;
    $('#drillAgain').onclick = () => { const o = q ? window.__qDrillOpt : window.__drillOpt; drill = null; startDrill(o); };
    $('#drillEnd').onclick = () => { drill = null; renderDrill(); render(); };
    return;
  }
  const it = getItem(drill.queue[drill.i]);
  if (!it) { drill.i++; return renderDrill(); }
  const lv = levelOf(it.count);
  let body;
  if (q) {
    const kd = kindOf(it.kind);
    body = `<div class="q-base">${baseHTML(it)}</div>
      <div class="cue-row">
        <span class="cue ${kd.k}">${esc(kd.name)}</span>
        <span class="cue-txt">${esc(cueText(it))}</span>
      </div>
      ${drill.shown
        ? `<div class="q-ans">${it.q || ''}</div>${it.a ? `<div class="q-a">${esc(it.a)}</div>` : ''}`
        : `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
             <button class="reveal-btn" id="reveal">答えを見る</button>
             ${drill.hint
               ? `<span class="hintword">${esc(leadWords(it.q))} …</span>`
               : `<button class="hintbtn" id="hintBtn">💡 出だし</button>`}
           </div>`}`;
  } else {
    const front = drill.dir === 'en2jp' ? `<div class="q-jp" style="font-family:var(--en)">${it.en || ''}</div>` : `<div class="q-jp">${esc(it.jp)}</div>`;
    const back = drill.dir === 'en2jp' ? `<div class="q-en" style="font-family:var(--jp);font-weight:600">${esc(it.jp)}</div>` : `<div class="q-en">${it.en || ''}</div>`;
    body = front + (drill.shown ? back : `<button class="reveal-btn" id="reveal">答えを見る</button>`);
  }
  el.innerHTML = `
    <div class="pcount"><span>${drill.i + 1} / ${drill.queue.length}</span><span>✓ ${drill.ok}　↺ ${drill.again}</span></div>
    <div class="progress"><i style="width:${(drill.i / drill.queue.length) * 100}%"></i></div>
    <div class="qcard">
      ${body}
      ${it.note && drill.shown ? `<div class="hint">${esc(it.note)}</div>` : ''}
    </div>
    <div class="q-meta">
      <span class="badge ${lv.cls}">${lv.icon} ${lv.name}<span style="opacity:.6">×${it.count}</span></span>
      <span class="last">${it.count ? '最終 ' + relLabel(it.last) : '未練習'}</span>
      ${weekDots(it)}
      <button class="more" id="drillQuit" style="margin-left:auto">✕</button>
    </div>
    <div class="q-actions">
      <button class="btn" id="btnAgain">↺ もう一回</button>
      <button class="btn primary" id="btnOk">⚡ 言えた</button>
    </div>
    <div class="hint" style="text-align:center;margin-top:12px">スペース＝答えを見る／→＝言えた／←＝もう一回${q ? '／H＝出だし' : ''}</div>`;
  $('#reveal') && ($('#reveal').onclick = () => { drill.shown = true; renderDrill(); });
  $('#hintBtn') && ($('#hintBtn').onclick = () => { drill.hint = true; renderDrill(); });
  $('#btnOk').onclick = () => { if (!drill.shown) { drill.shown = true; return renderDrill(); } markDone(it.id); drill.ok++; drill.i++; drill.shown = false; drill.hint = false; renderDrill(); renderStats(); };
  $('#btnAgain').onclick = () => { drill.queue.push(it.id); drill.again++; drill.i++; drill.shown = false; drill.hint = false; renderDrill(); };
  $('#drillQuit').onclick = () => { drill = null; renderDrill(); render(); };
}
document.addEventListener('keydown', e => {
  if (!drill || $('#viewDrill').classList.contains('hidden')) return;
  if (anySheetOpen()) return;
  if (e.key === ' ') { e.preventDefault(); if (!drill.shown) { drill.shown = true; renderDrill(); } }
  if (e.key === 'ArrowRight') { e.preventDefault(); $('#btnOk')?.click(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); $('#btnAgain')?.click(); }
  if (e.key === 'h' || e.key === 'H') { e.preventDefault(); $('#hintBtn')?.click(); }
});

/* ---------- tabs ---------- */
function setTab(which) {
  const l = which === 'list';
  $('#tabList').setAttribute('aria-selected', l);
  $('#tabDrill').setAttribute('aria-selected', !l);
  $('#viewList').classList.toggle('hidden', !l);
  $('#viewDrill').classList.toggle('hidden', l);
  $('#fab').classList.toggle('hidden', !l);
  if (l) render(); else renderDrill();
}
$('#tabList').onclick = () => setTab('list');
$('#tabDrill').onclick = () => setTab('drill');

/* ---------- fab: 下スクロール中は退避（ボタンの上に乗らないように） ---------- */
(function () {
  const fab = $('#fab');
  let lastY = window.scrollY, idle = null;
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    if (y > lastY + 8 && y > 120) fab.classList.add('tuck');
    else if (y < lastY - 8 || y < 60) fab.classList.remove('tuck');
    lastY = y;
    clearTimeout(idle);
    idle = setTimeout(() => fab.classList.remove('tuck'), 800);
  }, { passive: true });
})();

/* ---------- boot ---------- */
paintDeck();
render();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
